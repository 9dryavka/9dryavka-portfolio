<!doctype html>
<html lang="ja">
  <head>
    <title>9dryavka's portfolio</title>
    <meta charset="UTF-8" />
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
      crossorigin="anonymous"
      defer
    ></script>
    <script type="module" src="./src/js/main.js"></script>
    <link rel="icon" href="%BASE_URL%favicon.ico" />
  </head>
  <body>
    <main class="starry-sky starry-sky--bright shooting-stars">
      <header class="sr-only">
        <h1 id="site-title">9dryavka's portfolio</h1>
        <div id="content-link" class="sr-only">
          <!-- html-pluginにて、define/contents.jsの内容に基づきビルド時に注入 -->
        </div>
      </header>
      <div id="content-container">
        <!-- content-sourceの内容に基づきjavascriptで表示制御 -->
        <canvas id="canvas-controller"></canvas>
        <dialog id="content-modal" aria-label="詳細モーダル"></dialog>
        <dialog id="detail-modal" aria-label="詳細モーダル"></dialog>
      </div>
      <div id="content-source" class="sr-only">
        <!-- html-pluginにて、define/contents.jsの内容に基づきビルド時に注入 -->
      </div>
    </main>
  </body>
</html>
